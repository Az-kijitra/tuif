name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  publish-release:
    name: Build & Publish Release
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Check tag matches Cargo.toml version
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}".TrimStart("v")
          $ver = (Select-String -Path Cargo.toml -Pattern '^version\s*=\s*"([^"]+)"').Matches[0].Groups[1].Value
          if ($tag -ne $ver) { throw "Tag v$tag does not match Cargo.toml version $ver" }

      - name: Build & Package Release ZIP
        shell: pwsh
        run: |
          .\package.ps1

      - name: Extract release notes from CHANGELOG.md
        shell: pwsh
        run: |
          $ver = "${{ github.ref_name }}".TrimStart("v")
          $text = Get-Content CHANGELOG.md -Raw
          $m = [regex]::Match($text, "(?ms)^## \[$([regex]::Escape($ver))\][^\n]*\n(.*?)(?=^## \[|^\[[^\]]+\]: )")
          if (-not $m.Success) { throw "CHANGELOG.md has no section for $ver" }
          Set-Content -Path release-notes.md -Value $m.Groups[1].Value.Trim() -Encoding utf8

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: release-notes.md
          generate_release_notes: true
          files: |
            dist/tuif-*.zip
            dist/tuif-*.zip.sha256
            dist/tuif.exe
            dist/tuif.exe.sha256
            install.ps1
            uninstall.ps1
